<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
  </head>
  <body>
    <section class="portada">
      <div class="container">
        <div class="image">
          <img src="images/portrait.svg" alt="Portada" />
          <div class="text-portada">
            <a
              href="https://www.instagram.com/nineemedia?dlrf=MW1iOXV4c2NrYmRqcQ%3D%3D&utm_source=qr"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram de nineemedia"
            >
              <h2>@nineemedia</h2>
            </a>
          </div>
          <img class="overlay" src="images/notepaper.svg" alt="Portada" />
        </div>
      </div>
    </section>
    <section class="about">
      <div class="container-about">
        <div class="text-title">
          <h1 class="about-title" data-text="ABOUT">ABOUT</h1>
          <h1 data-text="MY">MY</h1>
          <h1 data-text="AUDIOVISUAL">AUDIOVISUAL</h1>
          <h1 data-text="SKILLS">SKILLS</h1>
        </div>
        <div class="text-tags" aria-label="Audiovisual skills">
          <h1>FILMMAKING</h1>
          <h1>PHOTOGRAPHY</h1>
          <h1>AUDIOVISUAL EDITOR</h1>
        </div>
        <div class="icon">
          <i class="fa7 fa-brands fa-bluesky"></i>
        </div>
      </div>
    </section>
    <section class="works">
      <div class="container-works">
        <h1 class="h1 works-title">2026 SELECTED WORKS</h1>

        <div class="swiper works-swiper" aria-label="Selected works gallery">
          <div class="swiper-wrapper">
            <article class="swiper-slide work-slide">
              <img src="images/photoworks.jpg" alt="Proyecto de arquitectura" />
            </article>

            <article class="swiper-slide work-slide">
              <img
                src="images/photoshootwork.png"
                alt="Proyecto de fotografía y performance"
              />
            </article>

            <article class="swiper-slide work-slide">
              <img
                src="images/photoshootcd.jpg"
                alt="Proyecto audiovisual de danza"
              />
            </article>

            <article class="swiper-slide work-slide work-slide--video">
              <iframe
                src="https://www.youtube.com/embed/YW_a619WAQk?si=L-Fvz1LNcSJea6nH"
                title="YouTube video player"
                frameborder="0"
                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                  web-share;
                "
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </article>
          </div>
        </div>
      </div>
    </section>
    <section class="footer">
      <div class="container-contact">
        <h1 class="contact-text">CONTACT<br />&amp; SOCIAL<br />MEDIA</h1>
        <div class="card-contac1">
          <div class="contact-box">
            <img src="images/contact botton ig.svg" alt="" />
          </div>
          <div class="contact-box">
            <img src="images/contact botton twt.svg" alt="" />
          </div>
          <div class="contact-box">
            <img src="images/contact botton yt.svg" alt="" />
          </div>
          <div class="contact-box">
            <img src="images/contact botton whts.svg" alt="" />
          </div>
          <p class="contact-cta">
            Tap to<br />explore<br />more of<br />my work!
          </p>
        </div>
        <div class="card-contac2">
          <div class="contact-social">
            <img src="images/contact botton igblack.svg" alt="" />
            <a
              href="https://www.instagram.com/nineemedia?dlrf=MW1iOXV4c2NrYmRqcQ%3D%3D&utm_source=qr"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
            >
              <i class="fa-brands fa-instagram"></i>
            </a>
          </div>
          <div class="contact-social">
            <img src="images/contact botton twtblack.svg" alt="" />
            <a
              href="https://www.youtube.com/@nineemedia"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="X"
            >
              <i class="fa-brands fa-x-twitter"></i>
            </a>
          </div>
          <div class="contact-social">
            <img src="images/contact botton ytblack.svg" alt="" />
            <a
              href="https://www.youtube.com/@nineemedia"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="YouTube"
            >
              <i class="fa-brands fa-youtube"></i>
            </a>
          </div>
          <div class="contact-social">
            <img src="images/contact botton whtsblack.svg" alt="" />
            <a
              href="https://www.youtube.com/@nineemedia"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="WhatsApp"
            >
              <i class="fa-brands fa-whatsapp"></i>
            </a>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
